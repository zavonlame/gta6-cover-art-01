<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Vice — GTA 6 Cover Art Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <h1>NEON VICE</h1>
  <p>Turn a photo and a caption into GTA-style cover art.</p>
</header>
<main class="app">
  <section class="preview-wrap">
    <canvas id="preview" width="1080" height="1080" aria-label="Cover preview"></canvas>
  </section>
  <section class="controls">
    <h2>Layout</h2>
    <div id="layouts" class="row"></div>

    <h2>Colour grade</h2>
    <div id="grades" class="row"></div>

    <h2>Words</h2>
    <label>Title <input id="title" type="text" maxlength="24" value="NEON VICE"></label>
    <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>

    <h2>Photos</h2>
    <div class="row">
      <button id="sample-boulevard" type="button">Sample: Boulevard</button>
      <button id="sample-pier" type="button">Sample: Pier</button>
    </div>
    <p class="hint">Or upload your own photo into a panel below — each panel has its own zoom and pan.</p>
    <div id="panels"></div>

    <h2>Export</h2>
    <div id="exports" class="row"></div>
    <p id="status" role="status"></p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
